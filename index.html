
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D. Lokesh | Java Lab Records</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0b1020;color:#f4f6ff}
header{padding:35px 20px;text-align:center;background:linear-gradient(135deg,#172554,#4338ca)}
header h1{margin:0;font-size:30px}
header p{color:#dbeafe}
.profile{max-width:850px;margin:25px auto;padding:22px;background:#151d33;border:1px solid #293653;border-radius:16px}
.profile h2{margin-top:0;color:#a5b4fc}
.details{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.detail{padding:14px;background:#202b45;border-radius:10px}
main{max-width:1000px;margin:30px auto;padding:0 16px}
main h2{color:#a5b4fc}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:#151d33;padding:20px;border:1px solid #293653;border-radius:14px}
.card h3{margin-top:0}
.card p{color:#b9c4da}
a.btn{display:inline-block;text-decoration:none;background:#4f46e5;color:white;padding:10px 14px;border-radius:8px}
footer{text-align:center;padding:25px;color:#9ca3af}
</style>
</head>
<body>
<header>
<h1>Java Programming Lab Records</h1>
<p>Learning • Coding • Practising</p>
</header>

<section class="profile">
<h2>Student Profile</h2>
<div class="details">
<div class="detail"><b>Name</b><br>D. Lokesh</div>
<div class="detail"><b>Roll Number</b><br>26eu02907</div>
<div class="detail"><b>Branch</b><br>AIML - B</div>
<div class="detail"><b>Course</b><br>B.Tech 2nd Year</div>
</div>
</section>

<main>
<h2>Java Lab Experiments</h2>
<p>Open each experiment to access its record PDF after uploading it.</p>
<div class="grid" id="experiments"></div>
</main>

<footer>
<p>© 2026 D. Lokesh | Java Programming Lab</p>
</footer>

<script>
const experiments = document.getElementById("experiments");

for(let i=1;i<=12;i++){
  experiments.innerHTML += `
    <article class="card">
      <h3>Experiment ${i}</h3>
      <p>Java Programming Lab Experiment ${i}</p>
      <p>PDF will be added soon.</p>
    </article>`;
}
</script>
</body>
</html>
